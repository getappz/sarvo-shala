[package]
name = "curriculum-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
description = "Dev-tool CLI: official board PDF -> original curriculum content -> compiled SQLite for Sarvo Shala"

[[bin]]
name = "curriculum-pipeline"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
pdf-inspector = "0.1.6"
ureq = { version = "2", features = ["json"] }
zstd = "0.13"
anyhow = "1"

[dev-dependencies]
printpdf = "0.7"
tempfile = "3"
