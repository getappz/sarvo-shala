name: security-check

# No paths filter: "cargo audit" is a required branch-protection check, and a
# path-filtered required check never reports on PRs that skip it — blocking
# the merge forever. Audit is cheap with a warm cache; run it everywhere.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2 # zizmor: ignore[cache-poisoning] save-if already gates writes to main
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-audit
      - run: cargo audit
        working-directory: src-tauri
